name: askmiao

services:
  postgres:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      TZ: Asia/Taipei
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ../backend/init-app-role.sh:/docker-entrypoint-initdb.d/20-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - askmiao-net

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - backend_keys:/app/keys
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    networks:
      - askmiao-net

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:?WEB_PORT is required}:80"
    networks:
      askmiao-net:
        ipv4_address: ${WEB_CONTAINER_IP:?WEB_CONTAINER_IP is required}

volumes:
  postgres_data:
  backend_data:
  backend_keys:
  backend_logs:

networks:
  askmiao-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK_SUBNET:?NETWORK_SUBNET is required}
