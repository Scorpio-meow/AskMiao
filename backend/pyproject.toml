[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hrchatbot-backend"
version = "0.1.0"
description = "Backend for HR expert knowledge ChatBot"
authors = [{ name = "Team" }]
requires-python = ">=3.11"
dependencies = []

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
pythonpath = ["src"]
