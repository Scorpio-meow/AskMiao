name: askmiao-local

services:
  postgres:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: postgres
      # 必須在 backend/.env 或殼層環境設定 POSTGRES_PASSWORD，未設定時拒絕啟動
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 backend/.env 設定 POSTGRES_PASSWORD}
      TZ: Asia/Taipei
    ports:
      # 只綁定本機回送位址，不對區網或公網開放
      - "127.0.0.1:7690:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d chatbot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - askmiao-net

volumes:
  postgres_data:

networks:
  askmiao-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.201.0/24
          gateway: 192.168.201.1
