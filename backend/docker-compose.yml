name: askmiao-local

services:
  postgres:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Taipei
    ports:
      - "7690:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d chatbot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - askmiao-net

volumes:
  postgres_data:

networks:
  askmiao-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.201.0/24
          gateway: 192.168.201.1
