# 將 site/ 目錄部署到 GitHub Pages。
# 一次性設定：GitHub 儲存庫 Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
name: Deploy GitHub Pages

on:
  push:
    branches: [New]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate sitemap
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          lastmod="$(git log -1 --format=%cs -- site)"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>%s/</loc>\n    <lastmod>%s</lastmod>\n  </url>\n</urlset>\n' "$SITE_URL" "$lastmod" > site/sitemap.xml
          cat site/sitemap.xml

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4